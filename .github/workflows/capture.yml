name: Capture Pre-Market Score

on:
  schedule:
    # All times below are UTC. IST = UTC + 5:30.
    # Mon-Fri only (cron day-of-week 1-5).
    - cron: "30 3 * * 1-5"   # 09:00 IST (pre-open cue)
    - cron: "0 4 * * 1-5"    # 09:30 IST (market open first check)
    - cron: "0 5 * * 1-5"    # 10:30 IST (hourly check)
    - cron: "0 6 * * 1-5"    # 11:30 IST (hourly check)
    - cron: "0 7 * * 1-5"    # 12:30 IST (hourly check)
    - cron: "0 8 * * 1-5"    # 13:30 IST (hourly check)
    - cron: "0 9 * * 1-5"    # 14:30 IST (hourly check)
    - cron: "0 10 * * 1-5"   # 15:30 IST (market close check)
    - cron: "30 10 * * 1-5"  # 16:00 IST (settlement / official day score)
    - cron: "30 15 * * 1-5"  # 21:00 IST (post US-market close)
  workflow_dispatch:
    inputs:
      slot:
        description: "Force a specific slot (HH:MM IST), e.g. 09:00. Leave blank to auto-detect."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run capture script
        run: |
          if [ -n "${{ github.event.inputs.slot }}" ]; then
            python capture_score.py --slot "${{ github.event.inputs.slot }}" --force
          else
            python capture_score.py
          fi

      - name: Commit and push updated CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/score_log.csv
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "Auto-capture score snapshot [skip ci]"
          git push
